name: Build ImmortalWRT Kmods

on:
  workflow_dispatch: # 允许在 GitHub 网页上手动点击触发

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  COMMIT_HASH: fcbac91 # 锁定与你路由器完全一致的 commit
  TARGET: qualcommax/ipq60xx

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget qemu-utils python3-pip
          

          pip3 install --break-system-packages setuptools distutils-precedence 2>/dev/null || true
      - name: Clone Source Code
        run: |
          # 不使用 --depth 1 和 -b，直接克隆仓库以获取完整历史
          # 如果仓库太大导致超时，可改用 git clone --filter=blob:none 进行部分克隆
          git clone $REPO_URL openwrt
          cd openwrt
          
          # 精确切换到目标 commit
          git checkout $COMMIT_HASH
          
          # 验证 commit 是否正确
          echo "Current HEAD:"
          git rev-parse HEAD

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Config for Kmods
        run: |
          cd openwrt
          # 生成默认配置
          make defconfig
          
          # 注入目标架构和所需内核模块的配置
          cat >> .config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_PACKAGE_kmod-xdp-sockets-diag=m
          CONFIG_PACKAGE_kmod-sched-bpf=m
          EOF
          
          # 展开并确认配置
          make defconfig

      - name: Download Dependencies
        run: |
          cd openwrt
          # 预下载所有源码包，避免编译时网络超时
          make download -j$(nproc)
          # 如果下载失败，单线程重试
          make download -j1 V=s

      - name: Compile Kmods
        run: |
          cd openwrt
          # 仅编译指定的内核模块包，大幅缩短编译时间
          make package/kmod-xdp-sockets-diag/compile -j$(nproc) V=s || make package/kmod-xdp-sockets-diag/compile -j1 V=s
          make package/kmod-sched-bpf/compile -j$(nproc) V=s || make package/kmod-sched-bpf/compile -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWRT-Kmods-${{ env.COMMIT_HASH }}
          path: openwrt/bin/targets/qualcommax/ipq60xx/packages/*.apk
