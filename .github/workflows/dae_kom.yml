name: Build ImmortalWRT Kmods

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'ImmortalWRT Commit Hash or Tag (e.g., fcbac91 or v24.10.0)'
        required: true
        default: 'fcbac91'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  TARGET: qualcommax/ipq60xx

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget qemu-utils python3-pip
          
          # Ubuntu 24.04+ 兼容处理
          pip3 install --break-system-packages setuptools distutils-precedence 2>/dev/null || true

      - name: Clone Source Code & Verify Commit
        run: |
          COMMIT="${{ github.event.inputs.commit_hash }}"
          echo "🔍 Target commit/tag: $COMMIT"
          
          # 使用 partial clone 加速，同时保留所有 refs
          git clone --filter=blob:none --no-checkout $REPO_URL openwrt
          cd openwrt
          
          # 验证 commit 是否存在
          if git cat-file -e "$COMMIT^{commit}" 2>/dev/null; then
            echo "✅ Commit found, checking out..."
            git checkout "$COMMIT"
          else
            echo "❌ Commit '$COMMIT' not found in repository!"
            echo "📋 Recent available tags:"
            git tag --sort=-creatordate | head -15
            echo ""
            echo "💡 Please check your commit hash or use one of the tags above."
            exit 1
          fi
          
          echo "Current HEAD: $(git rev-parse HEAD)"

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Config for Kmods
        run: |
          cd openwrt
          make defconfig
          
          # 注入目标架构和所需内核模块
          cat >> .config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_PACKAGE_kmod-xdp-sockets-diag=m
          CONFIG_PACKAGE_kmod-sched-bpf=m
          EOF
          
          make defconfig

      - name: Download Dependencies
        run: |
          cd openwrt
          make download -j$(nproc)
          make download -j1 V=s || true

      - name: Compile Kmods
        run: |
          cd openwrt
          # 编译指定模块（自动处理依赖）
          make package/kmod-xdp-sockets-diag/compile -j$(nproc) V=s || \
            make package/kmod-xdp-sockets-diag/compile -j1 V=s
            
          make package/kmod-sched-bpf/compile -j$(nproc) V=s || \
            make package/kmod-sched-bpf/compile -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWRT-Kmods-${{ github.event.inputs.commit_hash }}
          path: openwrt/bin/targets/qualcommax/ipq60xx/packages/*.apk
          if-no-files-found: warn
