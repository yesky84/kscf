name: Build VIKINGYFY ImmortalWRT Kmods

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Commit Hash or Tag (e.g., fcbac91)'
        required: true
        default: 'fcbac91'

env:
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt
  TARGET: qualcommax/ipq60xx

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget qemu-utils python3-pip
          
          pip3 install --break-system-packages setuptools distutils-precedence 2>/dev/null || true

      - name: Clone Source Code & Verify Commit
        run: |
          COMMIT="${{ github.event.inputs.commit_hash }}"
          echo "🔍 Target commit/tag: $COMMIT"
          echo "📦 Source: $REPO_URL"
          
          git clone --filter=blob:none --no-checkout $REPO_URL openwrt
          cd openwrt
          
          if git cat-file -e "$COMMIT^{commit}" 2>/dev/null; then
            echo "✅ Commit found, checking out..."
            git checkout "$COMMIT"
          else
            echo "❌ Commit '$COMMIT' not found in VIKINGYFY/immortalwrt!"
            echo "📋 Recent available tags:"
            git tag --sort=-creatordate | head -15
            exit 1
          fi
          
          echo "Current HEAD: $(git rev-parse HEAD)"

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Config & Find Kmods
        run: |
          cd openwrt
          make defconfig
          
          # 注入目标架构
          cat >> .config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          EOF
          make defconfig
          
          echo "=========================================="
          echo "🔍 Searching for XDP/BPF related kmods..."
          echo "=========================================="
          
          echo "📋 Matching symbols in current .config:"
          grep -iE 'CONFIG_PACKAGE_kmod.*(xdp|bpf|sched)' .config || echo "(None matched in .config)"
          
          echo ""
          echo "📋 Available kmod Makefiles containing xdp/bpf/sched:"
          find package target -name Makefile -exec grep -lE 'PKG_NAME.*kmod.*(xdp|bpf|sched)' {} \; 2>/dev/null || echo "(No matching Makefiles found)"
          
          echo ""
          echo "📋 Kernel config symbols (XDP/BPF/SCHED):"
          grep -iE '(XDP_SOCKETS|BPF_SYSCALL|SCHED_BPF|NET_SCHED)' target/linux/qualcommax/config-* 2>/dev/null || echo "(Not found in kernel config)"
          echo "=========================================="

      - name: Compile Kmods (Adaptive)
        run: |
          cd openwrt
          
          # 候选包名列表（按优先级排列）
          CANDIDATES=(
            "kmod-xdp-sockets-diag"
            "kmod-xdp"
            "kmod-bpf"
            "kmod-sched-bpf"
            "kmod-sched-core"
            "kmod-net-sched"
          )
          
          COMPILED=0
          for pkg in "${CANDIDATES[@]}"; do
            # 检查包是否存在于源码树中
            if find package target -name Makefile -exec grep -l "PKG_NAME:=${pkg}" {} \; 2>/dev/null | grep -q .; then
              echo "✅ Found $pkg, compiling..."
              if make package/${pkg}/compile -j$(nproc) V=s || make package/${pkg}/compile -j1 V=s; then
                COMPILED=$((COMPILED + 1))
              else
                echo "⚠️ Failed to compile $pkg"
              fi
            else
              echo "⏭️ Skipping $pkg (not found in source tree)"
            fi
          done
          
          if [ "$COMPILED" -eq 0 ]; then
            echo "❌ ERROR: No matching kmod packages were found or compiled!"
            echo "💡 This likely means these modules are either built-in to the kernel"
            echo "   or not yet defined as separate kmod packages in this commit."
            echo "   Please check the 'Find Kmods' step output above."
            exit 1
          fi
          
          echo "✅ Successfully compiled $COMPILED kmod package(s)"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWRT-Kmods-${{ github.event.inputs.commit_hash }}
          path: openwrt/bin/targets/qualcommax/ipq60xx/packages/*.apk
          if-no-files-found: warn
