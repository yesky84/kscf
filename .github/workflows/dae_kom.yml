name: Build LibWrt for JDY Arthur (IPQ60XX)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'LibWrt 分支'
        required: true
        default: '25.12-nss'
        type: string
      device_target:
        description: '目标平台 (IPQ60XX)'
        required: true
        default: 'qualcommax'
        type: string
      device_subtarget:
        description: '子平台型号'
        required: true
        default: 'ipq60xx'
        type: string
      device_profile:
        description: '设备 Profile (京东云亚瑟)'
        required: true
        default: 'jdcloud_ax1800-pro'
        type: string

env:
  TZ: Asia/Shanghai
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          df -hT

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            fastjar flex gawk gettext gcc-multilib g++-multilib git gperf \
            haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full \
            patch pkgconf python3 python3-pyelftools python3-setuptools \
            qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo apt-get autoremove --purge -y
          sudo apt-get clean

      - name: Clone LibWrt Source
        working-directory: /workdir
        run: |
          git clone --depth 1 -b ${{ github.event.inputs.branch }} $REPO_URL openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Update Feeds & Install Packages
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Default Config for JDY Arthur
        working-directory: openwrt
        run: |
          cat > .config << EOF
          CONFIG_TARGET_${{ github.event.inputs.device_target }}=y
          CONFIG_TARGET_${{ github.event.inputs.device_target }}_${{ github.event.inputs.device_subtarget }}=y
          CONFIG_TARGET_${{ github.event.inputs.device_target }}_${{ github.event.inputs.device_subtarget }}_DEVICE_${{ github.event.inputs.device_profile }}=y
          CONFIG_NSS_DRV=y
          CONFIG_NSS_FIRMWARE_VERSION_11_4=y
          EOF
          make defconfig

      - name: Download Packages
        working-directory: openwrt
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        id: compile
        working-directory: openwrt
        run: |
          echo "🚀 Start compiling at $(date)"
          make -j$(($(nproc) + 1)) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "🎉 Compile finished at $(date)"

      - name: Organize Output Files
        if: steps.compile.outputs.status == 'success'
        run: |
          mkdir -p output
          cp -rf openwrt/bin/targets/*/*/*.bin output/ 2>/dev/null || true
          cp -rf openwrt/bin/targets/*/*/*.ubi output/ 2>/dev/null || true
          cp -rf openwrt/bin/targets/*/*/*.tar output/ 2>/dev/null || true
          # 生成 SHA256 校验
          cd output && sha256sum * > sha256sums.txt
          echo "FILE_DATE=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

      - name: Upload Firmware to Artifacts
        if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: LibWrt-JDY-Arthur-${{ env.FILE_DATE }}
          path: output/

      - name: Create Release
        if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: LibWrt-JDY-${{ env.FILE_DATE }}
          name: LibWrt 京东云亚瑟 (IPQ60XX) ${{ env.FILE_DATE }}
          body: |
            ## 🔧 编译信息
            - **源码**: [LiBwrt/LibWrt](${{ env.REPO_URL }})
            - **分支**: `${{ github.event.inputs.branch }}`
            - **设备**: 京东云亚瑟 (IPQ60XX / ${{ github.event.inputs.device_profile }})
            - **NSS**: 满血支持 (NSS_DRV + FW 11.4)
            - **默认IP**: 192.168.1.1 (无密码)
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
