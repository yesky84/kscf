name: Build ImmortalWRT Kmods

on:
  workflow_dispatch: # 允许在 GitHub 网页上手动点击触发

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  COMMIT_HASH: fcbac91 # 锁定与你路由器完全一致的 commit
  TARGET: qualcommax/ipq60xx

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget qemu-utils

      - name: Clone Source Code
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          # 切换到指定的 commit，确保内核版本和 vermagic 完全匹配
          git fetch --depth 1 origin $COMMIT_HASH
          git checkout $COMMIT_HASH

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Config for Kmods
        run: |
          cd openwrt
          # 生成默认配置
          make defconfig
          
          # 注入目标架构和所需内核模块的配置
          cat >> .config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_PACKAGE_kmod-xdp-sockets-diag=m
          CONFIG_PACKAGE_kmod-sched-bpf=m
          EOF
          
          # 展开并确认配置
          make defconfig

      - name: Download Dependencies
        run: |
          cd openwrt
          # 预下载所有源码包，避免编译时网络超时
          make download -j$(nproc)
          # 如果下载失败，单线程重试
          make download -j1 V=s

      - name: Compile Kmods
        run: |
          cd openwrt
          # 仅编译指定的内核模块包，大幅缩短编译时间
          make package/kmod-xdp-sockets-diag/compile -j$(nproc) V=s || make package/kmod-xdp-sockets-diag/compile -j1 V=s
          make package/kmod-sched-bpf/compile -j$(nproc) V=s || make package/kmod-sched-bpf/compile -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWRT-Kmods-${{ env.COMMIT_HASH }}
          path: openwrt/bin/targets/qualcommax/ipq60xx/packages/*.apk
